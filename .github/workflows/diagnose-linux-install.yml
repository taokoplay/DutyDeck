name: Diagnose Linux install

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-linux-install.yml'

permissions:
  contents: read

jobs:
  diagnose:
    name: diagnose Linux bun install
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 诊断依赖安装
        shell: bash
        run: |
          set +e
          bun install --frozen-lockfile > "$RUNNER_TEMP/install.log" 2>&1
          status=$?
          tail -n 120 "$RUNNER_TEMP/install.log"
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 80 "$RUNNER_TEMP/install.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=bun install failed::$message"
          fi
          exit "$status"
